[package]
name = "frontharness"
version = "0.1.0"
edition = "2021"
authors = ["FrontHarness Contributors"]
description = "Event-driven CLI/TUI tool for automated frontend generation and deep redesign"

[[bin]]
name = "frontharness"
path = "src/main.rs"

[lib]
name = "frontharness"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = { version = "0.29", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive", "cargo"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
similar = { version = "2.6", features = ["inline"] }
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
